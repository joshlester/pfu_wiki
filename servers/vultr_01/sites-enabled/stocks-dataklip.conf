server {
	listen 80;
	listen [::]:80;

	server_name db-stocks.dataklip.com;
	
	location / {
		proxy_pass http://127.0.0.1:5433;
	}

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stocks.dataklip.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stocks.dataklip.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name stocks.dataklip.com;

    listen 80;
    listen [::]:80;
    
    return 301 https://stocks.dataklip.com$request_uri;
}

server {
    server_name stocks.dataklip.com;
   
    location / {
        proxy_pass http://127.0.0.1:3003;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stocks.dataklip.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stocks.dataklip.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
