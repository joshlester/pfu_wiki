version: "3.9"
services:

  db:
    container_name: josh_wiki_db
    image: postgres:11-alpine
    environment:
      POSTGRES_DB: db_josh_wiki
      POSTGRES_PASSWORD: HappyDay7
      POSTGRES_USER: josh_wikir
    logging:
      driver: "none"
    restart: unless-stopped
    volumes:
      - josh-wiki-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  wiki:
    container_name: josh_wiki_web
    image: requarks/wiki:2.5.201
    depends_on:
      - db
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: josh_wikir
      DB_PASS: HappyDay7
      DB_NAME: db_josh_wiki
    restart: unless-stopped
    ports:
      - "3333:3000"

volumes:
  josh-wiki-data:
